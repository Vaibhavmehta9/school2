    <div id="root">
      <div id="app-loading-state" aria-hidden="true">
        <style>
          #app-loading-state {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fbfaf6;
            color: #054b2d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            z-index: 99999;
          }
          .app-loading-crest {
            width: 72px;
            height: 72px;
            margin-bottom: 16px;
            animation: crestPulse 2s ease-in-out infinite;
          }
          .app-loading-title {
            font-family: "Georgia", "Cambria", serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #054b2d;
            margin: 0 0 6px 0;
          }
          .app-loading-sub {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #c59b27;
            margin: 0;
          }
          @keyframes crestPulse {
            0%, 100% {
              transform: scale(1);
              opacity: 0.9;
            }
            50% {
              transform: scale(1.05);
              opacity: 1;
            }
          }
          @media (prefers-color-scheme: dark) {
            #app-loading-state {
              background-color: #042a18;
              color: #fbfaf6;
            }
            .app-loading-title {
              color: #ffffff;
            }
            .app-loading-sub {
              color: #dfb846;
            }
          }
          @media (prefers-reduced-motion: reduce) {
            .app-loading-crest {
              animation: none !important;
            }
          }
        </style>
        <svg class="app-loading-crest" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

          <circle cx="32" cy="25" r="3.5" fill="#dfb846" />
