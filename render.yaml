# Render Blueprint Specification for Sheerwood College Admission Portal
# Documentation: https://render.com/docs/blueprint-spec

databases:
  - name: sheerwood-postgres
    databaseName: sheerwood
    user: sheerwood_admin
    plan: free

services:
  - type: web
    name: sheerwood-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DATABASE_URL
        fromDatabase:
          name: sheerwood-postgres
          property: connectionString
      - key: AUTH_MODE
        value: local
      - key: CORS_ORIGIN_REGEX
        value: ^https:\/\/.*\.vercel\.app$
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET_KEY
        generateValue: true

