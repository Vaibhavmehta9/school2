# Render Blueprint Specification for Sherwood College Admission Portal
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sheerwood-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: starter # Starter plan required for Persistent Disk attachment ($7/mo)
    healthCheckPath: /api/health
    disk:
      name: sheerwood-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: AUTH_MODE
        value: "local"
      - key: DATABASE_PATH
        value: "/data/sheerwood.demo.db"
      - key: ALLOWED_ORIGINS
        value: "https://sheerwood-admission-portal.vercel.app,https://sheerwood-portal.vercel.app,http://localhost:5173,http://localhost:4173"
      - key: AI_RATE_LIMIT_REQUESTS
        value: "20"
      - key: AI_RATE_LIMIT_WINDOW_SECONDS
        value: "300"
      - key: MAX_ADMISSION_DOCUMENT_BYTES
        value: "5242880"
      - key: EASEBUZZ_ENV
        value: "test"
      - key: OPENAI_API_KEY
        sync: false # Set securely in Render dashboard
