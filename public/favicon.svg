<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08783f" class="shield-grad-1" />
      <stop offset="100%" stop-color="#043d23" class="shield-grad-2" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb846" />
      <stop offset="100%" stop-color="#c59b27" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <style>
      .shield-bg { fill: url(#shieldGrad); stroke: url(#goldGrad); stroke-width: 2.5; stroke-linejoin: round; }
      .crest-gold { fill: url(#goldGrad); filter: url(#subtleGlow); }
      .crest-stroke { stroke: url(#goldGrad); stroke-width: 2; stroke-linecap: round; }
      @media (prefers-color-scheme: dark) {
        .shield-grad-1 { stop-color: #0a8f4c; }
        .shield-grad-2 { stop-color: #065430; }
        .shield-bg { stroke: #eed36b; stroke-width: 3; }
      }
    </style>
  </defs>

  <!-- Sherwood College Heraldic Shield Body -->
  <path class="shield-bg" d="M12 8 C12 6, 14 5, 18 5 L46 5 C50 5, 52 6, 52 8 L52 32 C52 46, 38 56, 32 59 C26 56, 12 46, 12 32 Z" />

  <!-- Shield Inner Border Accent -->
  <path d="M16 10 L48 10 L48 31 C48 43, 36 51, 32 54 C28 51, 16 43, 16 31 Z" fill="none" stroke="#dfb846" stroke-width="0.8" opacity="0.4" />

  <!-- Stylized Heritage Emblem: Cross & Sherwood Cedar Tree Mark -->
  <!-- Central Heraldic Cross -->
  <path d="M32 14 V44 M20 25 H44" fill="none" class="crest-stroke" />

  <!-- Upper Left Chevron Charge -->
  <path d="M22 17 L26 21 L23 21 L20 18 Z" class="crest-gold" />
  <!-- Upper Right Chevron Charge -->
  <path d="M42 17 L38 21 L41 21 L44 18 Z" class="crest-gold" />

  <!-- Lower Sherwood Crown Accent / Star at Intersection -->
  <circle cx="32" cy="25" r="3.2" fill="#dfb846" stroke="#043d23" stroke-width="0.8" />
  <circle cx="32" cy="25" r="1.5" fill="#ffffff" />
</svg>
